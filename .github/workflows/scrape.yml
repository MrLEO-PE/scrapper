name: Scrape PE jobs

# Two ways to run:
#   - the "Run workflow" button on the Actions tab
#   - automatically every morning
#
# A run scrapes the boards, enriches the schools, commits the updated database
# back to the repo so the "still available?" history survives, and publishes
# the report to GitHub Pages.

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources, comma separated (blank = all)"
        required: false
        default: ""
      enrich_limit:
        description: "Max schools to enrich (blank = all pending)"
        required: false
        default: ""
      shallow:
        description: "Skip vacancy detail pages (faster, much less data)"
        required: false
        default: false
        type: boolean
  schedule:
    # Follows the hiring year. International schools recruit from September to
    # January — posts appear and close inside a week, so those months run
    # three times a day. February to August is quiet, so once a day is plenty.
    # (Cron has no "if month" — two entries with different month lists do it.)
    # Minute 17, not 0: the top of the hour is when GitHub's scheduler is
    # busiest, and the runs here were starting five to seven hours late — a
    # role that closes inside a week can be gone before it was ever seen.
    - cron: "17 6,12,18 * 9-12,1 *"
    - cron: "17 6 * 2-8 *"

# Needed to commit the database back and to publish Pages.
permissions:
  contents: write
  pages: write
  # Needed to open the alert and source-health issues. Without it every
  # notification failed quietly for weeks.
  issues: write
  id-token: write

# Never let two runs write the database at once. The directory workflow shares
# the same database file, so both use this group.
concurrency:
  group: scrapper-db
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Was 60, which the enrich step below could exceed on a large backlog. A
    # job timeout cancels the remaining steps, so the database was never
    # committed and the whole run's work was thrown away — the one failure
    # here that loses data rather than merely delaying it.
    timeout-minutes: 150

    # Secrets are not readable from a step-level `if`, so they are lifted into
    # env here and the Sheets step tests the env value instead.
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      # Optional. A Brave Search API key (free: 2,000 searches a month). Without
      # it the website finder still works from the email addresses schools
      # publish, it just cannot search.
      SCRAPPER_SEARCH_KEY: ${{ secrets.SCRAPPER_SEARCH_KEY }}

    steps:
      # Check out the branch itself, not the commit that triggered the run.
      # Re-running an older run otherwise leaves a detached HEAD, which cannot
      # be pushed, and would also scrape with stale code.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Not committed, but reusing it between runs keeps us polite to the
      # sites and makes a rerun much faster.
      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: scrapper-http-${{ github.run_id }}
          restore-keys: scrapper-http-

      - name: Scrape
        run: |
          ARGS=""
          if [ -n "${{ inputs.sources }}" ]; then ARGS="$ARGS --sources ${{ inputs.sources }}"; fi
          if [ "${{ inputs.shallow }}" = "true" ]; then ARGS="$ARGS --shallow"; fi
          node --experimental-strip-types --no-warnings src/cli.ts scrape $ARGS

      # Schools with an open PE role and no website come first: the website is
      # what unlocks their careers email and facts. Fifteen a run keeps three
      # runs a day well inside a free search quota, a school that came back
      # empty is not tried again for sixty days, and every site found is
      # verified against the page before it is believed. A found site is saved
      # in the database and queues the school for the enrichment just below.
      - name: Find websites for schools that have none
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings src/cli.ts find-websites --limit 15

      # Bulk profiling belongs to the directory workflow, which now does five
      # hundred a day. This pass exists to profile the schools behind vacancies
      # found minutes ago, so it takes a bounded slice and leaves the rest.
      # Unbounded, it was the step that could overrun the job timeout and cost
      # the run its database.
      - name: Enrich schools
        run: |
          ARGS="--concurrency 6 --budget-ms 240000 --max-pages 25 --max-pdfs 6"
          ARGS="$ARGS --limit ${{ inputs.enrich_limit || '250' }}"
          node --experimental-strip-types --no-warnings src/cli.ts enrich $ARGS

      - name: Build the site
        run: node --experimental-strip-types --no-warnings src/cli.ts site

      # Opens an issue listing leadership roles and anything closing within a
      # week. GitHub emails you when an issue is opened, which makes this the
      # notification — no mail server, no secrets. Each role is marked as
      # alerted so tomorrow's run does not repeat it.
      # Never fatal: a notification problem must not discard a good scrape.
      - name: Alert on roles worth acting on
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          if TITLE=$(node --experimental-strip-types --no-warnings src/cli.ts alerts                 --site-url "$SITE_URL" --ids-out "$RUNNER_TEMP/alert-ids.json" --out "$RUNNER_TEMP/alert.md"); then
            echo "$TITLE"
            # Roles are stamped as alerted only once the issue really exists.
            # They used to be stamped first, so a failed notification lost the
            # roles for good: 117 were marked and nobody was told.
            if gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/alert.md"; then
              node --experimental-strip-types --no-warnings src/cli.ts mark-alerted --ids "$RUNNER_TEMP/alert-ids.json"
            else
              echo "::warning::Could not open the alert issue — the roles stay unmarked and will be tried again next run."
            fi
          else
            echo "Nothing new worth alerting about."
          fi

      # A source that quietly returns nothing looks exactly like a quiet day.
      # Opens one issue (or comments on the open one) when a board returns far
      # fewer vacancies than it usually does.
      - name: Check every source returned what it usually does
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! node --experimental-strip-types --no-warnings src/cli.ts health --out "$RUNNER_TEMP/health.md"; then
            OPEN=$(gh issue list --state open --search "Source health in:title" --json number -q '.[0].number')
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --body-file "$RUNNER_TEMP/health.md"
            else
              gh issue create --title "Source health: a job board stopped returning vacancies" --body-file "$RUNNER_TEMP/health.md"
            fi
          fi

      # Optional. Skipped entirely unless both secrets are set, so the
      # workflow works out of the box with no configuration.
      - name: Sync to Google Sheets
        if: env.GOOGLE_SHEET_ID != '' && env.GOOGLE_SERVICE_ACCOUNT_JSON != ''
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          node --experimental-strip-types --no-warnings src/cli.ts export \
            --format csv --sheet-id "$GOOGLE_SHEET_ID" --key-file "$RUNNER_TEMP/sa.json"
          rm -f "$RUNNER_TEMP/sa.json"

      # Uploaded before the commit step so a git problem can never stop the
      # results being published — the scraping is the expensive part and its
      # output should always reach the site.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Saving the database is best-effort. Losing a day of history is a
      # nuisance; failing the whole run over it, after a successful scrape,
      # is worse. A real problem is still printed loudly in the log.
      - name: Commit the database
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/jobs.db

          if git diff --staged --quiet; then
            echo "Database unchanged — nothing to commit."
            exit 0
          fi

          git commit -m "Scrape $(date -u +%Y-%m-%d)"

          # Another run, or you, may have pushed while this one was working.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Database saved."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 5
          done

          echo "::warning::Could not save data/jobs.db. The site still published;"
          echo "::warning::history for this run is lost but the next run recovers."
          exit 1

  publish:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
